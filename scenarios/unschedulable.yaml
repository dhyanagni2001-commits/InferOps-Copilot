apiVersion: apps/v1
kind: Deployment
metadata: {name: unschedulable-demo, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: unschedulable-demo}}
  template:
    metadata: {labels: {app: unschedulable-demo}}
    spec:
      containers:
        - name: model
          image: busybox:1.36
          command: ["sleep", "infinity"]
          # Deliberately larger than any demo node.
          resources: {requests: {cpu: "64", memory: 512Gi}}
