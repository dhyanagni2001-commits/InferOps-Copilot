apiVersion: apps/v1
kind: Deployment
metadata: {name: missing-config, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: missing-config}}
  template:
    metadata: {labels: {app: missing-config}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "infinity"]
          envFrom: [{configMapRef: {name: model-api-config}}]
