apiVersion: apps/v1
kind: Deployment
metadata: {name: healthy-demo, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: healthy-demo}}
  template:
    metadata: {labels: {app: healthy-demo}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 3}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
