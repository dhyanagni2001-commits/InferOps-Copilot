apiVersion: apps/v1
kind: Deployment
metadata: {name: crashloop-demo, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: crashloop-demo}}
  template:
    metadata: {labels: {app: crashloop-demo}}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          # Simulates a server that exits when required configuration is missing.
          command: ["sh", "-c", "echo 'starting model-api'; echo 'ERROR: MODEL_PATH environment variable is required' >&2; exit 3"]
