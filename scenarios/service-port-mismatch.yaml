apiVersion: apps/v1
kind: Deployment
metadata: {name: port-demo, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: port-demo}}
  template:
    metadata: {labels: {app: port-demo}}
    spec:
      containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: broken-service, namespace: inferops-demo}
spec:
  selector: {app: port-demo}
  ports: [{port: 80, targetPort: 9999}]
