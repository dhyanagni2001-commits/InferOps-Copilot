apiVersion: apps/v1
kind: Deployment
metadata: {name: broken-readiness, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: broken-readiness}}
  template:
    metadata: {labels: {app: broken-readiness}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /missing-health, port: 80}, periodSeconds: 3}
