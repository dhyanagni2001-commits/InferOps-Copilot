apiVersion: apps/v1
kind: Deployment
metadata: {name: oom-demo, namespace: inferops-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom-demo}}
  template:
    metadata: {labels: {app: oom-demo}}
    spec:
      containers:
        - name: memory
          image: python:3.12-alpine
          command: ["python", "-c", "x=[]\nwhile True: x.append('x'*1000000)"]
          resources: {limits: {memory: 32Mi}, requests: {memory: 16Mi}}
