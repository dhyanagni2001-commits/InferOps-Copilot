server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://inferops-backend:8080;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }

    location /health/ {
        proxy_pass http://inferops-backend:8080;
    }

    location / {
        try_files $uri /index.html;
    }
}
