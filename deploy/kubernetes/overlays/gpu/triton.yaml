apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
spec:
  replicas: 1
  selector:
    matchLabels: {app: triton}
  template:
    metadata:
      labels: {app: triton}
    spec:
      initContainers:
        - name: model-repository
          image: inferops/model-repository:minilm
          command: [sh, -c, "cp -r /model_repository/. /models/"]
          volumeMounts: [{name: models, mountPath: /models}]
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:25.08-py3
          # The exported MiniLM encoder runs on CPU (KIND_CPU), leaving the GPU to vLLM.
          args: ["tritonserver", "--model-repository=/models", "--model-control-mode=none", "--exit-on-error=true"]
          ports:
            - {name: http, containerPort: 8000}
            - {name: grpc, containerPort: 8001}
            - {name: metrics, containerPort: 8002}
          readinessProbe: {httpGet: {path: /v2/health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /v2/health/live, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {memory: 4Gi}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes: [{name: models, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: triton
spec:
  selector: {app: triton}
  ports:
    - {name: http, port: 8000, targetPort: http}
    - {name: grpc, port: 8001, targetPort: grpc}
    - {name: metrics, port: 8002, targetPort: metrics}
