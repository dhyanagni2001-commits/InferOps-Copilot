# Local kind cluster: images loaded with `kind load`, a generated development token.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inferops-demo
resources:
  - ../../base
images:
  - {name: inferops/backend, newTag: dev}
  - {name: inferops/frontend, newTag: dev}
secretGenerator:
  - name: inferops-secrets
    literals: [API_BEARER_TOKEN=kind-local-token]
    options: {disableNameSuffixHash: true}
patches:
  - target: {kind: Deployment, name: inferops-(backend|frontend)}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
