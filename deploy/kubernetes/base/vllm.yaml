apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inferops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.11.0
          args: ["--model", "Qwen/Qwen2.5-1.5B-Instruct", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: "2", memory: 6Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 12Gi, nvidia.com/gpu: "1"}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inferops-demo
spec:
  selector: {app: vllm}
  ports: [{port: 8000, targetPort: 8000}]
