apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferops-frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: inferops-frontend}
  template:
    metadata:
      labels: {app: inferops-frontend}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: frontend
          image: inferops/frontend:latest
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: BACKEND_URL, value: "http://inferops-backend:8080"}
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          # nginx renders its config template and keeps pid/cache files in these writable mounts.
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: inferops-frontend
spec:
  selector: {app: inferops-frontend}
  ports: [{name: http, port: 80, targetPort: http}]
