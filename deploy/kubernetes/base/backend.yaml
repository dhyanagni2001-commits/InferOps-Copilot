apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferops-backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: inferops-backend}
  template:
    metadata:
      labels: {app: inferops-backend}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      serviceAccountName: inferops-backend
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: backend
          image: inferops/backend:latest
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - configMapRef: {name: inferops-config}
            - secretRef: {name: inferops-secrets}
          env:
            - {name: HOME, value: /tmp}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 3}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: inferops-backend
spec:
  selector: {app: inferops-backend}
  ports: [{name: http, port: 8080, targetPort: http}]
