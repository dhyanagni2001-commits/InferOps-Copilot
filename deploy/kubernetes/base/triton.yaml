apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: inferops-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: triton}
  template:
    metadata:
      labels: {app: triton}
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:25.08-py3
          args: ["tritonserver", "--model-repository=/models", "--strict-model-config=false"]
          ports: [{containerPort: 8000}, {containerPort: 8001}]
          volumeMounts: [{name: models, mountPath: /models}]
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
      volumes: [{name: models, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: inferops-demo
spec:
  selector: {app: triton}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
    - {name: grpc, port: 8001, targetPort: 8001}
