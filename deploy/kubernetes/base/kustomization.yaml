apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inferops-demo
labels:
  - pairs: {app.kubernetes.io/part-of: inferops-copilot}
    includeSelectors: false
resources:
  - namespace.yaml
  - service-account.yaml
  - rbac.yaml
  - configmap.yaml
  - backend.yaml
  - frontend.yaml
  - vector-db.yaml
  - network-policy.yaml
# The inferops-secrets Secret (API_BEARER_TOKEN) is created out of band; see secret.example.yaml.
