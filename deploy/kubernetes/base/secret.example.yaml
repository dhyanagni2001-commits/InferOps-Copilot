# Copy, set a long random token, and apply before deploying:
#   kubectl create secret generic inferops-secrets -n inferops-demo --from-literal=API_BEARER_TOKEN="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: inferops-secrets
  namespace: inferops-demo
type: Opaque
stringData:
  API_BEARER_TOKEN: replace-before-deploying
