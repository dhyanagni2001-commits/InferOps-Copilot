[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferops-copilot"
version = "0.2.0"
description = "Evidence-grounded Kubernetes and inference-serving diagnostics API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
triton = ["tokenizers>=0.19,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["agent/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["UP007", "UP045", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ingestion", "evaluation"]
