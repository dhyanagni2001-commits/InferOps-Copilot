# Local stack.
#   docker compose up --build                       # demo mode UI + API on http://localhost:8080 (UI_PORT to change)
#   EMBEDDING_BACKEND=triton USE_QDRANT=true docker compose --profile retrieval up --build
#                                                   # adds Triton embeddings + Qdrant (export the model first; see inference/triton)
services:
  backend:
    build: {context: ., dockerfile: deploy/docker/backend.Dockerfile}
    image: inferops/backend:dev
    environment:
      DEMO_MODE: "true"
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-dev-token}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      EMBEDDING_TOKENIZER_PATH: /models/embedding/tokenizer/tokenizer.json
      TRITON_HTTP_URL: http://triton:8000
      USE_QDRANT: ${USE_QDRANT:-false}
      QDRANT_URL: http://qdrant:6333
      USE_LLM: ${USE_LLM:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
    volumes: ["./model_repository:/models:ro"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: {context: ., dockerfile: deploy/docker/frontend.Dockerfile}
    image: inferops/frontend:dev
    environment: {BACKEND_URL: "http://backend:8080"}
    ports: ["${UI_PORT:-8080}:8080"]
    depends_on: {backend: {condition: service_healthy}}

  qdrant:
    profiles: [retrieval]
    image: qdrant/qdrant:v1.15.5
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  triton:
    profiles: [retrieval]
    image: nvcr.io/nvidia/tritonserver:25.08-py3
    command: ["tritonserver", "--model-repository=/models", "--exit-on-error=true"]
    ports: ["8002:8000"]
    volumes: ["./model_repository:/models:ro"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/v2/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingest:
    profiles: [retrieval]
    image: inferops/backend:dev
    command: ["python", "-m", "ingestion.build_index", "--embedding-backend=triton", "--output=", "--qdrant-url=http://qdrant:6333"]
    environment:
      EMBEDDING_TOKENIZER_PATH: /models/embedding/tokenizer/tokenizer.json
      TRITON_HTTP_URL: http://triton:8000
    volumes: ["./model_repository:/models:ro"]
    depends_on:
      triton: {condition: service_healthy}
      qdrant: {condition: service_started}
      backend: {condition: service_healthy}
    restart: on-failure:5

volumes:
  qdrant-data:
