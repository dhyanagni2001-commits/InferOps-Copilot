name: ci

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: python -m pip install -e './backend[dev,triton]'
      - run: ruff check backend ingestion evaluation scripts inference --config backend/pyproject.toml
      - run: python -m pytest -q
        working-directory: backend
      - name: Retrieval quality (offline index)
        run: python -m ingestion.build_index && python -m evaluation.retrieval_eval

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install -e './backend'
      - run: .venv/bin/python -m ingestion.build_index
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: frontend/test-results}

  kind-e2e:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m venv .venv && .venv/bin/pip install -e './backend'
      - uses: helm/kind-action@v1
        with: {cluster_name: inferops}
      - run: ./scripts/kind-e2e.sh
        env: {OUTPUT: evaluation/results/kind-e2e-ci.json}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kind-e2e-results, path: evaluation/results/kind-e2e-ci.json}
      - if: failure()
        run: kubectl get pods,events -n inferops-demo && kubectl logs -n inferops-demo deploy/inferops-backend --tail=200
